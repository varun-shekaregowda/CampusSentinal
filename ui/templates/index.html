<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Sentinel - Enterprise NVR Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: #c5c6c7; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
        }
        
        .header { 
            background: rgba(31, 40, 51, 0.6); 
            backdrop-filter: blur(10px);
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            z-index: 10;
        }
        .header h1 { margin: 0; font-size: 26px; color: #66fcf1; font-weight: 700;}
        
        .dashboard { display: flex; height: calc(100vh - 65px); }
        
        .video-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: max-content;
            gap: 1rem;
            padding: 20px;
            overflow-y: auto;
        }
        
        .camera-card {
            background: #000;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }
        .camera-card.enlarged { 
            position: fixed; top: 65px; left: 0; width: 100vw; height: 85vh; max-height: 85vh; z-index: 9999; 
            border-radius: 0; margin: 0; padding: 0; border: none; aspect-ratio: unset;
        }
        .rec-badge {
            position: absolute; top: 12px; right: 50px;
            background: #e74c3c; color: #fff; font-size: 11px;
            font-weight: 700; padding: 3px 8px; border-radius: 4px;
            z-index: 10; letter-spacing: 1px; display: none;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
            animation: blinkRec 1s infinite;
        }
        @keyframes blinkRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .camera-card img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Prevents squishing/stretching */
        }
        
        .camera-info { 
            position: absolute; top: 0; left: 0; right: 0; 
            background: linear-gradient(180deg, rgba(11,12,16,0.9) 0%, rgba(11,12,16,0) 100%);
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        
        .camera-controls {
            position: absolute; bottom: -60px; left: 0; right: 0;
            background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(5px);
            padding: 10px; display: flex; flex-direction: column; gap: 5px;
            transition: bottom 0.3s ease;
        }
        .camera-card:hover .camera-controls { bottom: 0; }
        
        .control-buttons { display: flex; gap: 10px; justify-content: center; align-items: center; }
        .control-buttons button { padding: 5px 10px; font-size: 12px; }
        .scrubber-container { display: flex; gap: 10px; align-items: center; width: 100%; }
        .scrubber-container input { flex: 1; }
        .scrubber-time { font-size: 12px; color: #66fcf1; font-variant-numeric: tabular-nums;}
        
        .sidebar { 
            flex: 1; background: rgba(31, 40, 51, 0.4); border-left: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; flex-direction: column; 
        }
        .sidebar-header { padding: 20px; background: rgba(11, 12, 16, 0.5); font-weight: 700; color: #45a29e; }
        .alerts-container { flex: 1; overflow-y: auto; padding: 20px; }
        .alert-item { background: rgba(11, 12, 16, 0.6); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ff4757; }
        
        button { background-color: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;}
        button:hover { background-color: rgba(255,255,255,0.2); }
        button.primary { background: linear-gradient(45deg, #45a29e, #66fcf1); color: #0b0c10; border: none;}
        button.primary:hover { transform: translateY(-2px); }
        
        .alert-item { background: rgba(11, 12, 16, 0.6); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ff4757; cursor: pointer; transition: background 0.2s; }
        .alert-item:hover { background: rgba(255, 71, 87, 0.1); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1f2833; padding: 35px; border-radius: 16px; width: 600px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 25px; }
        
        .clip-item { display: flex; justify-content: space-between; background: rgba(11,12,16,0.5); padding: 15px; margin-bottom: 10px; border-radius: 8px; align-items: center; }
        
        #incidentImage:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(102, 252, 241, 0.25);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Campus Sentinel NVR</h1>
        <div style="display:flex; gap: 15px; align-items:center;">
            <span id="connection-status" style="font-weight:600; font-size:14px; color:#eab308;">🟡 Connecting...</span>
            <button class="primary" onclick="openClips()">🎬 Saved Clips</button>
            <button class="primary" onclick="openSettings()">⚙️ Config</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="video-grid" id="video-grid"></div>
        <div class="sidebar">
            <div class="sidebar-header">Incident Logs</div>
            <div class="alerts-container" id="alerts"></div>
        </div>
    </div>

    <!-- Modals (Settings & Clips) -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><h2>Settings</h2><button onclick="document.getElementById('settingsModal').style.display='none'">✕</button></div>
            <div id="cameraList"></div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">
            <h3 style="color: #45a29e; margin-top:0;">Add New Feed</h3>
            <div class="cam-form" id="addCamForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                <input type="text" id="newName" placeholder="Location/Name (e.g. Exam Hall 2)" style="padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                <select id="newSourceType" onchange="toggleSourceInput()" style="padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                    <option value="webcam">Local Webcam</option>
                    <option value="ip">IP Camera / RTSP</option>
                    <option value="video">Upload Video File</option>
                </select>
                <input type="number" id="newWebcamIndex" placeholder="Webcam Index (e.g. 0)" min="0" style="padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                <input type="text" id="newIpUrl" placeholder="RTSP/HTTP URL" style="display:none; padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                <input type="file" id="newVideoFile" accept="video/mp4,video/x-m4v,video/*" style="display:none; padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                <select id="newMode" style="padding: 12px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit;">
                    <option value="CLASSROOM">CLASSROOM (Security & Occupancy)</option>
                    <option value="EXAM">EXAM (Malpractice Detection)</option>
                </select>
                <button class="primary" onclick="addCamera()">Deploy Camera</button>
            </div>
        </div>
    </div>

    <div class="modal" id="clipsModal">
        <div class="modal-content" style="width: 800px;">
            <div class="modal-header"><h2>🎬 Saved 2-Minute Incident Clips</h2><button onclick="document.getElementById('clipsModal').style.display='none'">✕</button></div>
            <div id="clipsList"></div>
            <div id="clipPlayerContainer" style="margin-top: 20px; display:none;">
                <video id="clipPlayer" controls style="width: 100%; border-radius: 8px; border: 1px solid #45a29e;"></video>
            </div>
        </div>
    </div>
    
    <div class="modal" id="incidentModal">
        <div class="modal-content" style="width: 900px;">
            <div class="modal-header"><h2 id="incidentTitle">Incident Evidence</h2><button onclick="document.getElementById('incidentModal').style.display='none'; document.getElementById('incidentVideo').pause();">✕</button></div>
            <div style="display:flex; gap: 20px; align-items: flex-start;">
                <div style="flex:1;">
                    <h3 style="margin-top:0; color:#45a29e;">High-Res Screenshot</h3>
                    <img id="incidentImage" src="" onclick="window.open(this.src, '_blank');" style="cursor: pointer; transition: transform 0.2s; width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-height: 200px; object-fit: cover;" title="Click to open full-screen in new tab">
                </div>
                <div style="flex:1;">
                    <h3 style="margin-top:0; color:#45a29e;">30-Second Auto-Clip</h3>
                    <video id="incidentVideo" controls style="width: 100%; border-radius: 8px; border: 1px solid #ff4757; background:#000; min-height: 200px;"></video>
                </div>
            </div>
            <p id="incidentDesc" style="margin-top:20px; font-size:18px; color:white;"></p>
        </div>
    </div>

    <script>
        let camsState = {};
        let eventCache = {};

        async function loadCameras() {
            const res = await fetch('/api/cameras');
            const cameras = await res.json();
            
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            
            cameras.forEach(cam => {
                camsState[cam.id] = { total: 0 };
                grid.innerHTML += `
                <div class="camera-card" id="card-${cam.id}">
                    <div class="rec-badge" id="rec-badge-${cam.id}">● REC</div>
                    <div class="camera-info">
                        <span>${cam.name}</span>
                        <button onclick="document.getElementById('card-${cam.id}').classList.toggle('enlarged')">⛶</button>
                    </div>
                    <img src="/video_feed/${cam.id}" style="width:100%; height:100%; object-fit:contain;">
                    <div class="camera-controls">
                        <div class="scrubber-container" id="scrubber-container-${cam.id}" style="display:none;">
                            <span class="scrubber-time" id="time-${cam.id}">00:00</span>
                            <input type="range" id="seek-${cam.id}" min="0" max="100" value="0" onchange="seekCam('${cam.id}', this.value)">
                        </div>
                        <div class="control-buttons">
                            <button id="play-pause-${cam.id}" onclick="togglePlay('${cam.id}')">⏸ Pause</button>
                            <button id="speed-1-${cam.id}" style="display:none;" onclick="controlCam('${cam.id}', 'speed', 1)">1x</button>
                            <button id="speed-2-${cam.id}" style="display:none;" onclick="controlCam('${cam.id}', 'speed', 2)">⏩ 2x</button>
                            <button id="speed-4-${cam.id}" style="display:none;" onclick="controlCam('${cam.id}', 'speed', 4)">⏩ 4x</button>
                            <button id="btn-record-${cam.id}" class="primary" onclick="toggleRecord('${cam.id}')">🔴 Record 2-Min Clip</button>
                        </div>
                    </div>
                </div>`;
            });
            renderSettingsList(cameras);
        }

        async function toggleRecord(camId) {
            const btn = document.getElementById(`btn-record-${camId}`);
            if (btn) {
                if (camsState[camId]?.is_capturing) {
                    btn.innerText = '⏳ Saving Clip...';
                } else {
                    btn.innerText = '⏳ Initializing...';
                }
            }
            await controlCam(camId, 'capture');
        }

        async function controlCam(camId, action, value=null) {
            await fetch(`/api/cameras/${camId}/control`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action, value})
            });
        }

        function togglePlay(camId) {
            const btn = document.getElementById(`play-pause-${camId}`);
            if (btn.innerText.includes('Pause')) {
                controlCam(camId, 'pause');
            } else {
                controlCam(camId, 'play');
            }
        }

        async function seekCam(camId, percentage) {
            const total = camsState[camId].total || 1000;
            const targetFrame = Math.floor((percentage / 100) * total);
            await controlCam(camId, 'seek', targetFrame);
        }

        // Telemetry loop
        setInterval(async () => {
            for(let camId in camsState) {
                try {
                    const res = await fetch(`/api/cameras/${camId}/status`);
                    const status = await res.json();
                    if(status && status.total > 0) {
                        camsState[camId].total = status.total;
                        
                        // Reveal playback controls
                        document.getElementById(`scrubber-container-${camId}`).style.display = 'flex';
                        document.getElementById(`speed-1-${camId}`).style.display = 'inline-block';
                        document.getElementById(`speed-2-${camId}`).style.display = 'inline-block';
                        document.getElementById(`speed-4-${camId}`).style.display = 'inline-block';
                        
                        // Update Play/Pause button text based on status
                        const btn = document.getElementById(`play-pause-${camId}`);
                        if (btn) {
                            if (status.paused) {
                                btn.innerText = '▶ Play';
                            } else {
                                btn.innerText = '⏸ Pause';
                            }
                        }

                        const pct = (status.frame / status.total) * 100;
                        const slider = document.getElementById(`seek-${camId}`);
                        if(slider && document.activeElement !== slider) {
                            slider.value = pct;
                            // Estimate time (15fps approx)
                            const currentSec = Math.floor(status.frame / 15);
                            const m = String(Math.floor(currentSec / 60)).padStart(2, '0');
                            const s = String(currentSec % 60).padStart(2, '0');
                            document.getElementById(`time-${camId}`).innerText = `${m}:${s}`;
                        }
                    }

                    // Recording status telemetry
                    const recBtn = document.getElementById(`btn-record-${camId}`);
                    const recBadge = document.getElementById(`rec-badge-${camId}`);
                    camsState[camId].is_capturing = !!status.is_capturing;
                    
                    if (status.is_capturing) {
                        const camFps = status.fps || 20;
                        const secsLeft = Math.ceil((status.capture_left || 0) / camFps);
                        const mins = Math.floor(secsLeft / 60);
                        const secs = String(secsLeft % 60).padStart(2, '0');
                        if (recBtn) {
                            recBtn.style.background = '#e74c3c';
                            recBtn.style.color = '#fff';
                            recBtn.innerText = `⏹ Stop Rec (${mins}:${secs})`;
                        }
                        if (recBadge) recBadge.style.display = 'block';
                    } else {
                        if (recBtn && !recBtn.innerText.includes('Initializing') && !recBtn.innerText.includes('Saving')) {
                            recBtn.style.background = '';
                            recBtn.style.color = '';
                            recBtn.innerText = `🔴 Record 2-Min Clip`;
                        }
                        if (recBadge) recBadge.style.display = 'none';
                    }
                } catch(e) {}
            }
        }, 1000);

        async function openClips() {
            document.getElementById('clipsModal').style.display = 'flex';
            const res = await fetch('/api/clips');
            const clips = await res.json();
            const list = document.getElementById('clipsList');
            if (!clips || clips.length === 0) {
                list.innerHTML = `<p style="color:#aaa; text-align:center; padding:20px;">No recorded clips found.</p>`;
                return;
            }
            list.innerHTML = clips.map(c => `
                <div class="clip-item" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; margin-bottom:8px; background:rgba(255,255,255,0.05); border-radius:6px; border:1px solid rgba(255,255,255,0.1);">
                    <div>
                        <span style="font-weight:600; color:${c.filename.startsWith('clip_') ? '#e74c3c' : '#45a29e'};">
                            ${c.filename.startsWith('clip_') ? '🔴 [Manual 2-Min]' : '⚠️ [Incident 30s]'}
                        </span>
                        <span style="margin-left:8px; color:#ddd; font-size:14px;">${c.filename}</span>
                    </div>
                    <button class="primary" onclick="playClip('${c.url}')" style="padding:6px 14px;">▶ Play</button>
                </div>
            `).join('');
        }

        function playClip(url) {
            const container = document.getElementById('clipPlayerContainer');
            const player = document.getElementById('clipPlayer');
            container.style.display = 'block';
            player.src = url;
            player.load();
            player.play().catch(e => console.log('Autoplay blocked or load error:', e));
        }

        function toggleSourceInput() {
            const type = document.getElementById('newSourceType').value;
            document.getElementById('newWebcamIndex').style.display = type === 'webcam' ? 'block' : 'none';
            document.getElementById('newIpUrl').style.display = type === 'ip' ? 'block' : 'none';
            document.getElementById('newVideoFile').style.display = type === 'video' ? 'block' : 'none';
        }

        function renderSettingsList(cameras) {
            const list = document.getElementById('cameraList');
            list.innerHTML = '';
            cameras.forEach(cam => {
                list.innerHTML += `
                <div class="cam-list-item" style="background: rgba(11, 12, 16, 0.5); padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
                        <strong>${cam.name}</strong>
                        <button class="danger" onclick="deleteCamera('${cam.id}')" style="background-color: rgba(255, 71, 87, 0.2); border-color: #ff4757; color: #ff4757; border-radius:6px; padding:6px 12px; cursor:pointer;">Remove</button>
                    </div>
                    <div class="cam-form" style="margin-top:0;">
                        <select onchange="updateCamera('${cam.id}', {mode: this.value})" style="padding: 8px; background: rgba(11, 12, 16, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px;">
                            <option value="CLASSROOM" ${cam.mode === 'CLASSROOM' ? 'selected' : ''}>CLASSROOM</option>
                            <option value="EXAM" ${cam.mode === 'EXAM' ? 'selected' : ''}>EXAM</option>
                        </select>
                    </div>
                </div>`;
            });
        }

        async function addCamera() {
            const name = document.getElementById('newName').value;
            const mode = document.getElementById('newMode').value;
            const sourceType = document.getElementById('newSourceType').value;
            let url = "";
            if (sourceType === 'webcam') url = document.getElementById('newWebcamIndex').value;
            else if (sourceType === 'ip') url = document.getElementById('newIpUrl').value;
            else if (sourceType === 'video') {
                const fileInput = document.getElementById('newVideoFile');
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);
                    const uploadRes = await fetch('/api/upload_video', { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    url = uploadData.url;
                }
            }
            if(!name || url === "") return alert('Name and Source required');
            await fetch('/api/cameras', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, url, mode})
            });
            document.getElementById('newName').value = '';
            document.getElementById('newWebcamIndex').value = '';
            document.getElementById('newIpUrl').value = '';
            document.getElementById('newVideoFile').value = '';
            loadCameras();
        }

        async function updateCamera(id, updates) {
            await fetch(`/api/cameras/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(updates) });
            loadCameras();
        }

        async function deleteCamera(id) {
            if(!confirm('Remove this camera feed?')) return;
            await fetch(`/api/cameras/${id}`, { method: 'DELETE' });
            loadCameras();
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }
        
        function getMediaUrl(path) {
            if (!path) return "";
            path = path.replace(/\\/g, '/');
            if (path.startsWith('/')) return path;
            if (path.startsWith('storage/')) return '/' + path;
            return '/' + path;
        }

        function openIncident(eventId) {
            const ev = eventCache[eventId];
            if (!ev) return;
            
            document.getElementById('incidentTitle').innerText = `${ev.event_type} - ${ev.timestamp}`;
            document.getElementById('incidentDesc').innerText = ev.description;
            
            const img = document.getElementById('incidentImage');
            const vid = document.getElementById('incidentVideo');
            
            img.src = getMediaUrl(ev.screenshot || ev.screenshot_path);
            vid.src = getMediaUrl(ev.video || ev.video_path);
            
            document.getElementById('incidentModal').style.display = 'flex';
            if(vid.src) {
                vid.play().catch(e => console.log(e));
            }
        }

        function appendAlertHtml(alert, prepend = true) {
            eventCache[alert.id] = alert;
            const html = `
                <div class="alert-item" onclick="openIncident(${alert.id})">
                    <div style="font-size:12px;color:#aaa;">${alert.timestamp} | ${alert.cam_id}</div>
                    <div>${alert.description}</div>
                </div>
            `;
            const container = document.getElementById('alerts');
            if(prepend) container.innerHTML = html + container.innerHTML;
            else container.innerHTML += html;
        }

        async function loadEvents() {
            const res = await fetch('/api/events');
            const events = await res.json();
            document.getElementById('alerts').innerHTML = '';
            events.forEach(ev => appendAlertHtml(ev, false));
        }

        // Add Websocket
        const wsUrl = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/ws/alerts';
        function connect() {
            const ws = new WebSocket(wsUrl);
            ws.onopen = function() {
                const el = document.getElementById('connection-status') || document.getElementById('ws-status');
                if (el) {
                    el.innerText = '🟢 Connected';
                    el.style.color = '#4ade80';
                }
            };
            ws.onmessage = (e) => {
                const alert = JSON.parse(e.data);
                appendAlertHtml(alert, true);
            };
            ws.onclose = () => {
                const el = document.getElementById('connection-status') || document.getElementById('ws-status');
                if (el) {
                    el.innerText = '🔴 Disconnected';
                    el.style.color = '#ef4444';
                }
                setTimeout(connect, 2000);
            };
        }

        loadCameras();
        loadEvents();
        connect();
    </script>
</body>
</html>
